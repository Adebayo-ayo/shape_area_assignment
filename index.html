<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: rgb(21, 41, 7)">
    <p>My Assignment</p>
    <!-- a. area of a triangle right angled tri... 1/2 * (height * base) sin 90 -->
    <input
      placeholder="Trangle Height"
      style="display: block; border: 2px solid red; width: 100px; height: 20px; "
      type="number"
      name=""
      id="height"
    />
    <input
      placeholder="Trangle base"
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      name=""
      id="base"
    />
    <div
      style="
        background-color: whitesmoke;
        width: 100px;
        height: 20px;
        margin-top: 20px;
      "
      id="display"
    ></div>
    <button onclick="show()">Solve</button>

    <!-- b. area of a square -->
    <input
      style="display: block;margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      name=""
      id="lenght"
      placeholder="Lenght of Square"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      name=""
      id="breath"
      placeholder="breath of Square"
    />
    <div
      style="
        background-color: whitesmoke;
        width: 100px;
        height: 20px;
        margin-top: 20px;
      "
      id="squareDisplay"
    ></div>
    <button onclick="square()">Solve</button>

    <!-- c. area of a circle -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="circleRadius"
      placeholder="Radius"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="circleDisplay"
    ></div>
    <button onclick="circle()">Solve</button>

    <!-- d. area of a Quadrilateral (Kite) -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="quadDiag1"
      placeholder="1st Diagonal"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="quadDiag2"
      placeholder="2nd Diagonal"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="quadDisplay"
    ></div>
    <button onclick="quadrilateral()">Solve</button>

    <!-- e. area of a Rhombus -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="rhomDiag1"
      placeholder="Vertical Diag"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="rhomDiag2"
      placeholder="Horiz Diag"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="rhomDisplay"
    ></div>
    <button onclick="rhombus()">Solve</button>

    <!-- f. area of a Trapezium -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="trapTop"
      placeholder="Parallel Top"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="trapBottom"
      placeholder="Parallel Btm"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="trapHeight"
      placeholder="Height"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="trapDisplay"
    ></div>
    <button onclick="trapezium()">Solve</button>

    <!-- g. area of a Parallelogram -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="paraLength"
      placeholder="Length"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="paraBreadth"
      placeholder="Breadth"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="paraDisplay"
    ></div>
    <button onclick="parallelogram()">Solve</button>

    <!-- h. BMI -->
    <input
      style="display: block; margin-top:20px; border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="bmiWeight"
      placeholder="Weight (kg)"
    />
    <input
      style="border: 2px solid red; width: 100px; height: 20px"
      type="number"
      id="bmiHeight"
      placeholder="Height (m)"
    />
    <div
      style="background-color: whitesmoke; width: 100px; height: 20px; margin-top: 20px;"
      id="bmiDisplay"
    ></div>
    <button onclick="bmi()">Solve</button>

  </body>
</html>
